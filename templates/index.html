{% extends "base.html" %}

{% block content %}
<div class="container my-5">
    <h2 class="mb-4">Generate Your Vedic Astrology Report</h2>
    <form action="/report" method="POST">
        <div class="mb-3">
            <label for="name" class="form-label">Full Name</label>
            <input type="text" class="form-control" id="name" name="name" required>
        </div>
        <div class="row">
            <div class="col-md-6 mb-3">
                <label for="dob" class="form-label">Date of Birth</label>
                <input type="date" class="form-control" id="dob" name="dob" required>
            </div>
            <div class="col-md-6 mb-3">
                <label for="tob" class="form-label">Time of Birth (24h)</label>
                <input type="time" class="form-control" id="tob" name="tob" required>
            </div>
        </div>
        <div class="row">
            <div class="col-md-6 mb-3">
                <label for="lat" class="form-label">Latitude (e.g., 28.61)</label>
                <input type="number" step="any" class="form-control" id="lat" name="lat" required>
            </div>
            <div class="col-md-6 mb-3">
                <label for="lon" class="form-label">Longitude (e.g., 77.20)</label>
                <input type="number" step="any" class="form-control" id="lon" name="lon" required>
            </div>
        </div>
        <button type="submit" class="btn btn-primary w-100">Calculate Jatakam</button>
    </form>
</div>
{% endblock %}
